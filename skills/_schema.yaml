version: "2.0"

required:
  - id
  - name
  - version
  - category
  - phase
  - risk
  - execution_mode
  - depends_on
  - provides
  - triggers
  - parameters
  - output

optional:
  - false_positives
  - references

parameter_types:
  string: "free text (path, hostname)"
  integer: "integer (PID, port, core count)"
  float: "decimal number (CPU percentage threshold, RAM in GB)"
  datetime: "timestamp ISO 8601"
  duration: "interval (1h, 30m, 7d)"
  boolean: "true/false"
  enum: "closed set of values"
  filepath: "validated remote filesystem path"
  regex: "regular expression"

block_risk_levels:
  ro: "read-only — no server modifications"
  info: "read-only — non-mutating metadata query"
  probe: "read-only — repeated measurements (snapshots), without artificial load"

execution_modes:
  auto: "automatic execution without confirmation (ro/info/probe only)"
  confirm: "requires explicit confirmation (non-read-only actions)"
  manual: "not automated; requires human intervention"

severity_levels:
  CRITICAL: "may cause an outage, data loss or unavailability"
  HIGH: "significant issue requiring prompt resolution"
  MEDIUM: "recommended optimization or best-practice gap"
  LOW: "minor or convenience improvement"
  INFO: "observation without immediate action"

confidence_levels:
  HIGH: "direct, reproducible evidence"
  MEDIUM: "indirect or single-snapshot evidence; requires validation"
  LOW: "weak, inconclusive indication"
  INSUFFICIENT_DATA: "insufficient data to support a claim"

capacity_status:
  NORMAL: "expected, stable usage"
  WATCH: "monitor; no immediate action"
  WARNING: "approaching a limit or trending negatively"
  CRITICAL: "at or beyond a limit; immediate action required"

output_schema:
  type: object
  properties:
    skill_id: { type: string }
    execution_time: { type: string, format: datetime }
    host: { type: string }
    risk_level: { type: string, enum: [ro, info, probe] }
    evidence_files:
      type: array
      items: { type: string, description: "paths to evidence artifacts" }
    findings:
      type: array
      items:
        type: object
        properties:
          severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW, INFO] }
          category: { type: string }
          confidence: { type: string, enum: [HIGH, MEDIUM, LOW, INSUFFICIENT_DATA] }
          observation: { type: string }
          evidence: { type: string }
          analysis: { type: string }
          recommendation: { type: string }
          validation: { type: string }
          rollback: { type: string }
