version: "1.0"
# ---------------------------------------------------------------------------
# Symptom-driven diagnosis map.
#
# The agent reads this file when the operator reports a *symptom* ("the site
# returns 502", "the disk is full", "a container keeps restarting") and needs to
# go from symptom -> ranked hypotheses -> evidence -> root cause -> remediation.
#
# This file is DATA, not code. Adding a new symptom is a YAML edit, no Python
# changes. Each hypothesis references real skills (skills/_index.yaml) and the
# evidence keys they produce, so the diagnosis stays evidence-first and the
# skills stay the single source of truth for *how* to collect that evidence.
# ---------------------------------------------------------------------------

symptoms:
  - id: "http_5xx"
    label: "Site returns 500 / 502 / 503 / 504"
    order:
      - "502_bad_gateway"
      - "503_service_unavailable"
      - "504_gateway_timeout"
      - "500_internal_error"

  - id: "cert_error"
    label: "Browser certificate / TLS error"
    order:
      - "cert_expired"
      - "cert_mismatch"

  - id: "site_down"
    label: "Site down / connection refused / timeout"
    order:
      - "service_down"
      - "container_down"
      - "port_not_listening"

  - id: "disk_full"
    label: "Disk full / writes fail"
    order: ["disk_full"]

  - id: "oom"
    label: "Process terminated / killed / out of memory"
    order: ["oom_kill"]

  - id: "high_load"
    label: "High CPU / load, general slowdown"
    order: ["runaway_process"]

  - id: "slow"
    label: "Slow responses"
    order: ["slow_backend", "slow_db"]

  - id: "db_error"
    label: "Database connection failure"
    order: ["db_unreachable"]

  - id: "crash_loop"
    label: "Container crash loop / restarts"
    order: ["crash_loop"]

  - id: "dns_error"
    label: "DNS errors (EAI_AGAIN / ENOTFOUND)"
    order: ["dns_failure"]

  - id: "log_flood"
    label: "Uncontrolled log growth / disk filled by logs"
    order: ["log_growth"]

  - id: "backup_gap"
    label: "Suspected missing / untested backups"
    order: ["backup_missing"]

  - id: "teleport_agent_failure"
    label: "Teleport agent disconnected or unavailable"
    order: ["teleport_service_failure"]

  - id: "database_cluster_flap"
    label: "Frequent failover / intermittent PostgreSQL backend / no Patroni primary"
    order: ["distributed_consensus_latency", "database_backend_flap"]

  - id: "credential_theft"
    label: "Suspected credential theft (.env / GitHub keys)"
    order:
      - "env_files_exposed"
      - "git_credentials_stolen"
      - "ssh_key_compromised"
      - "docker_secret_leak"
      - "web_secret_exposure"
      - "exfiltration_detected"

hypotheses:
  502_bad_gateway:
    label: "502 Bad Gateway"
    checks:
      - name: "Upstream backend unavailable or not listening"
        how: >
          The proxy (Apache/nginx) reached the upstream but received no valid response.
          The container may be 'up' while its application process has terminated.
        evidence: ["web_server_analysis.upstream_health", "web_server_analysis.proxy_upstream_map"]
        confirm: "curl -s -o /dev/null -w '%{http_code}' http://<upstream-host>:<port>/  -> 000/refused"
        skills: ["web_server_analysis", "docker_troubleshooting", "container_log_analysis", "log_analysis"]
        remediation: "Bring up the backend (Level 3: restart the service/container) and remove a stale PID file if applicable."
      - name: "Proxy points to the wrong host/port"
        how: "Configuration drift between the vhost (ProxyPass) and the application's actual listening port."
        evidence: ["web_server_analysis.proxy_upstream_map", "network_analysis.port_process_map"]
        confirm: "Compare the ProxyPass target with ss -tlnp and docker port."
        skills: ["web_server_analysis", "network_analysis"]
        remediation: "Point ProxyPass/proxy_pass to the correct port (Level 3)."
      - name: "Upstream terminates while handling the request (OOM/segfault)"
        how: "The backend responds to ping but crashes during processing (memory pressure, slow database)."
        evidence: ["log_analysis.oom_in_logs", "container_log_analysis.container_crash_logs"]
        confirm: "dmesg | grep -i oom; docker inspect OOMKilled."
        skills: ["log_analysis", "docker_troubleshooting"]
        remediation: "Reduce memory usage / enable swap / increase RAM (Level 3)."

  503_service_unavailable:
    label: "503 Service Unavailable"
    checks:
      - name: "No healthy backends / exhausted workers"
        how: "All workers are busy or the backend pool is empty."
        evidence: ["web_server_analysis.upstream_health"]
        confirm: "Proxy logs show 'no live upstreams' / max_children reached."
        skills: ["web_server_analysis", "log_analysis"]
        remediation: "Scale workers/backends or investigate why they are saturated."
      - name: "Maintenance or application startup"
        how: "The application explicitly returns 503 (maintenance mode, migrations in progress)."
        evidence: ["http_health_analysis.endpoint_status"]
        confirm: "Inspect the application's response directly."
        skills: ["http_health_analysis"]
        remediation: "Wait for maintenance to finish / complete migrations."

  504_gateway_timeout:
    label: "504 Gateway Timeout"
    checks:
      - name: "Slow / stalled backend (slow database, N+1, deadlock)"
        how: "The upstream accepted the request but did not respond in time."
        evidence: ["http_health_analysis.response_times", "capacity_analysis.headroom"]
        confirm: "Run curl -w '%{time_total}' against the backend directly; inspect the slow query log."
        skills: ["http_health_analysis", "capacity_analysis", "log_analysis"]
        remediation: "Optimize queries / indexes / proxy timeout (Level 3)."

  500_internal_error:
    label: "500 Internal Server Error"
    checks:
      - name: "Application error (stack trace in logs)"
        how: "Unhandled framework exception (Rails/Django/Node)."
        evidence: ["log_analysis.journal_errors", "container_log_analysis.container_error_logs"]
        confirm: "Tail the application log for a stack trace / exception."
        skills: ["log_analysis", "container_log_analysis"]
        remediation: "Fix the bug; deployment may be required (Level 3)."

  cert_expired:
    label: "Expired certificate"
    checks:
      - name: "Expired or soon-to-expire certificate"
        how: "The expiry date has passed or is less than 30 days away without automatic renewal."
        evidence: ["tls_certificate_analysis.cert_expiry"]
        confirm: "openssl x509 -enddate -noout -in fullchain.pem."
        skills: ["tls_certificate_analysis", "backup_analysis"]
        remediation: "Renew the certificate (certbot renew) and verify the automatic renewal timer."

  cert_mismatch:
    label: "Certificate does not match the domain"
    checks:
      - name: "SAN does not include ServerName"
        how: "The vhost uses a domain missing from the certificate SAN."
        evidence: ["tls_certificate_analysis.cert_sans", "tls_certificate_analysis.cert_host_match"]
        confirm: "Compare ServerName with the SAN list."
        skills: ["tls_certificate_analysis", "web_server_analysis"]
        remediation: "Reissue the certificate for the correct domain."

  service_down:
    label: "Systemd service unavailable"
    checks:
      - name: "Unit in failed/inactive state"
        how: "The service exposing the port is not running."
        evidence: ["systemd_analysis.services_failed", "reliability_analysis.recovery_mechanisms"]
        confirm: "systemctl status <unit>."
        skills: ["systemd_analysis", "reliability_analysis"]
        remediation: "Start the service and configure Restart=on-failure (Level 3)."

  container_down:
    label: "Container stopped / no application process"
    checks:
      - name: "Exited container or terminated internal application"
        how: "The container may be 'running' while its internal application process has terminated."
        evidence: ["docker_troubleshooting.container_exit_codes", "docker_analysis.containers"]
        confirm: "docker ps -a (status) + curl to container-IP:port."
        skills: ["docker_analysis", "docker_troubleshooting", "container_log_analysis"]
        remediation: "Run docker start / compose up and investigate why it terminated (exit code)."

  port_not_listening:
    label: "Nothing listening on the expected port"
    checks:
      - name: "Bound to the wrong interface/port"
        how: "The application listens on 127.0.0.1 or another port rather than the proxy's expected destination."
        evidence: ["network_analysis.open_ports", "network_analysis.port_process_map"]
        confirm: "ss -tlnp | grep <port>."
        skills: ["network_analysis", "web_server_analysis"]
        remediation: "Bind the application to the correct port/interface."

  disk_full:
    label: "Disk full"
    checks:
      - name: "Partition at 100% / exhausted inodes"
        how: "Without free space, application writes fail (database, logs, sessions)."
        evidence: ["disk_analysis.fs_usage", "disk_analysis.inodes", "disk_analysis.large_dirs"]
        confirm: "df -h; du -x / | sort -h | tail."
        skills: ["disk_analysis", "observability_analysis"]
        remediation: "Rotate/clean logs and old artifacts; expand the disk (Level 3)."

  oom_kill:
    label: "Process killed by OOM"
    checks:
      - name: "Kernel OOM killer terminated a process"
        how: "Without swap and with several large processes, the kernel kills a process to recover memory."
        evidence: ["log_analysis.oom_in_logs", "memory_analysis.swap", "reliability_analysis.spof_list"]
        confirm: "dmesg | grep -i 'killed process'; free -h (no swap)."
        skills: ["log_analysis", "memory_analysis", "reliability_analysis"]
        remediation: "Enable swap, limit container memory, increase RAM (Level 3)."

  runaway_process:
    label: "CPU-consuming process"
    checks:
      - name: "Infinite loop / runaway process"
        how: "One process monopolizes CPU and degrades other workloads."
        evidence: ["cpu_analysis.cpu_per_process", "process_analysis.top_cpu_processes"]
        confirm: "Observe sustained usage in top/ps sorted by %CPU."
        skills: ["cpu_analysis", "process_analysis"]
        remediation: "Investigate the process; restart if appropriate (Level 3)."

  slow_backend:
    label: "Slow backend"
    checks:
      - name: "Slow application response (not network latency)"
        how: "High time_total when accessing the backend directly."
        evidence: ["http_health_analysis.response_times", "capacity_analysis.headroom"]
        confirm: "Compare curl -w '%{time_total}' for the direct backend and proxy."
        skills: ["http_health_analysis", "capacity_analysis", "log_analysis"]
        remediation: "Optimize the application / scale resources / add caching (Level 3)."

  slow_db:
    label: "Slow database"
    checks:
      - name: "Slow queries / missing indexes / saturated connections"
        how: "The database is the bottleneck."
        evidence: ["database_analysis.db_connections", "database_analysis.db_settings"]
        confirm: "Slow query log / pg_stat_activity."
        skills: ["database_analysis", "capacity_analysis"]
        remediation: "Add indexes / optimize queries / use connection pooling."

  db_unreachable:
    label: "Unreachable database"
    checks:
      - name: "Remote database unavailable / network / credentials"
        how: "The application points to a database outside the host that does not respond."
        evidence: ["database_analysis.db_location", "database_analysis.db_connections"]
        confirm: "Test TCP connectivity to the database host:port."
        skills: ["database_analysis", "network_analysis"]
        remediation: "Restore connectivity or recover the remote database."

  crash_loop:
    label: "Container crash loop"
    checks:
      - name: "Repeated nonzero exit code / OOM / application error"
        how: "The container repeatedly starts and terminates."
        evidence: ["docker_troubleshooting.container_exit_codes", "container_log_analysis.container_crash_logs"]
        confirm: "docker ps (RestartCount) + docker logs <c>."
        skills: ["docker_troubleshooting", "container_log_analysis"]
        remediation: "Fix the cause (configuration, migrations, dependencies) and relaunch."

  dns_failure:
    label: "DNS resolution failure"
    checks:
      - name: "Unreachable nameserver / broken resolv.conf"
        how: "EAI_AGAIN / ENOTFOUND in the application or containers."
        evidence: ["docker_troubleshooting.container_dns_config", "network_analysis.dns"]
        confirm: "Run nslookup from the host and from the container."
        skills: ["docker_troubleshooting", "network_analysis"]
        remediation: "Fix /etc/resolv.conf or Docker DNS settings (Level 3)."

  log_growth:
    label: "Uncontrolled log growth"
    checks:
      - name: "Unrotated log filling the disk"
        how: "An application/container log grows without a bound."
        evidence: ["observability_analysis.log_rotation", "disk_analysis.large_dirs"]
        confirm: "find /var/log -size +500M."
        skills: ["observability_analysis", "disk_analysis"]
        remediation: "Configure logrotate / Docker log max-size (Level 3)."

  backup_missing:
    label: "Missing or untested backups"
    checks:
      - name: "No backup mechanism for persistent data"
        how: "Data (database, uploads) has no backup or tested restore procedure."
        evidence: ["backup_analysis.backup_mechanisms", "backup_analysis.restore_readiness"]
        confirm: "Check the backup cron/timer and a recent artifact."
        skills: ["backup_analysis"]
        remediation: "Implement backups and a restore test (Level 3)."

  teleport_service_failure:
    label: "Teleport agent not operational"
    checks:
      - name: "Stopped service or invalid configuration"
        how: "The systemd unit cannot start because of configuration, permissions or incompatible parameters."
        evidence: ["teleport_analysis.teleport_service_state", "teleport_analysis.teleport_config_validity", "teleport_analysis.teleport_errors"]
        confirm: "Correlate ActiveState/ExecMainStatus, configuration timestamp, actual startup and the first causal journal error."
        skills: ["teleport_analysis", "systemd_analysis", "log_analysis"]
        remediation: "Fix configuration or permissions and restart Teleport (Level 3)."
      - name: "Identity or registration failure"
        how: "The identity expired, was revoked, or the join method cannot register the agent."
        evidence: ["teleport_analysis.teleport_errors", "teleport_analysis.teleport_roles"]
        confirm: "Logs repeatedly show x509, certificate, join, token or CA pin errors."
        skills: ["teleport_analysis"]
        remediation: "Renew the identity through the authorized join method and restart Teleport (Level 3)."
      - name: "Unreachable Proxy or Auth Server"
        how: "DNS, routing, firewall or the remote port prevents the agent from maintaining its reverse tunnel."
        evidence: ["teleport_analysis.teleport_connectivity", "teleport_analysis.teleport_errors"]
        confirm: "Resolution or TCP testing fails at the same time as timeout/refused/no-route log events."
        skills: ["teleport_analysis", "network_analysis", "dns_analysis", "firewall_analysis"]
        remediation: "Restore DNS/routing/ACL access to the correct Teleport endpoint (Level 3)."

  distributed_consensus_latency:
    label: "etcd loses quorum or changes leader because of latency"
    checks:
      - name: "Disk or network latency exceeds Raft timing limits"
        how: "Slow fsyncs or peer packet loss/retransmission delays heartbeats and elections."
        evidence: ["etcd_analysis.etcd_latency", "etcd_analysis.etcd_quorum", "network_analysis.tcp_retransmits"]
        confirm: "Correlate leader changes and timeouts with WAL/backend histograms, ss -tin and a health time series."
        skills: ["etcd_analysis", "io_analysis", "network_analysis", "log_analysis"]
        remediation: "Provide low-latency storage and a stable private network between members; adjust timeouts only after fixing infrastructure."

  database_backend_flap:
    label: "HAProxy intermittently loses the Patroni primary"
    checks:
      - name: "The /master check alternates between 200 and timeout"
        how: "The primary exists, but its health API or TCP path stops responding within the timeout."
        evidence: ["web_server_analysis.tcp_backend_health", "network_analysis.tcp_retransmits"]
        confirm: "Compare HAProxy DOWN/no-server events with direct :8008 probes and TCP sockets to :5432."
        skills: ["web_server_analysis", "network_analysis", "database_analysis", "etcd_analysis"]
        remediation: "Fix loss/latency to the primary and validate the Patroni host; do not hide the fault by increasing the health-check timeout."

  # === CREDENTIAL THEFT HYPOTHESES ===
  env_files_exposed:
    label: "Exposed .env files"
    checks:
      - name: ".env in a web-accessible directory"
        how: "The web server can serve .env directly when it is unprotected inside DocumentRoot."
        evidence: ["credential_exposure_analysis.web_exposed_env", "web_secret_exposure.web_env_access"]
        confirm: "curl -I http://localhost/.env returns 200 instead of 404/403."
        skills: ["credential_exposure_analysis", "web_secret_exposure"]
        remediation: "Block .env access in nginx/apache (deny all) and move .env outside DocumentRoot."
      - name: ".env world-readable"
        how: "The .env file has mode 644/777 and any local user can read it."
        evidence: ["credential_exposure_analysis.env_permissions"]
        confirm: "ls -la /path/.env shows world-readable permissions."
        skills: ["credential_exposure_analysis"]
        remediation: "Set mode 600 (owner-only) and check that the file is not tracked in Git."
      - name: ".env in a Git directory"
        how: "The .env file is inside a Git repository and may have been committed."
        evidence: ["credential_exposure_analysis.env_files", "git_credential_analysis.git_repos"]
        confirm: "git -C /path/repo check-attr -a .env; git -C /path/repo log --all -- .env"
        skills: ["credential_exposure_analysis", "git_credential_analysis"]
        remediation: "Remove .env from Git history (git filter-branch or BFG) and add it to .gitignore."
      - name: ".env in /tmp or a temporary location"
        how: "The .env file was copied to /tmp or /var/tmp, possibly by a deployment process or an attacker."
        evidence: ["credential_exposure_analysis.env_files", "filesystem_forensics.file_timeline"]
        confirm: "Check file ownership and timestamps in /tmp."
        skills: ["credential_exposure_analysis", "filesystem_forensics"]
        remediation: "Remove .env from /tmp and investigate why it was copied there."

  git_credentials_stolen:
    label: "Stolen Git credentials"
    checks:
      - name: ".git-credentials exists on the server"
        how: "The .git-credentials file contains plaintext GitHub/GitLab credentials."
        evidence: ["git_credential_analysis.git_credentials"]
        confirm: "find / -name '.git-credentials' -type f"
        skills: ["git_credential_analysis"]
        remediation: "Remove .git-credentials; use an encrypted credential helper or SSH keys."
      - name: "GitHub token in .git/config"
        how: "The .git/config file contains a URL with an embedded token (https://ghp_TOKEN@github.com/...)."
        evidence: ["git_credential_analysis.git_credentials"]
        confirm: "cat .git/config | grep 'url.*@github.com'"
        skills: ["git_credential_analysis"]
        remediation: "Remove the token from .git/config, revoke it in GitHub and use SSH."
      - name: "GitHub token in bash_history"
        how: "A GitHub token used in a command was recorded in .bash_history."
        evidence: ["git_credential_analysis.github_tokens", "filesystem_forensics.bash_history"]
        confirm: "grep 'ghp_' /root/.bash_history"
        skills: ["git_credential_analysis", "filesystem_forensics"]
        remediation: "Revoke the token immediately in GitHub and clean bash_history."
      - name: "SSH key without a passphrase"
        how: "An SSH key without a passphrase was found, allowing direct use if the file is stolen."
        evidence: ["git_credential_analysis.ssh_keys"]
        confirm: "ssh-keygen -y -f /path/id_rsa (a passphrase prompt indicates protection)."
        skills: ["git_credential_analysis"]
        remediation: "Add a passphrase and rotate the key in GitHub."
      - name: "Agent forwarding enabled"
        how: "ForwardAgent yes in SSH configuration can expose the user's agent to abuse for signing commits."
        evidence: ["git_credential_analysis.ssh_keys"]
        confirm: "grep -r 'ForwardAgent' ~/.ssh/config"
        skills: ["git_credential_analysis"]
        remediation: "Disable ForwardAgent or restrict it to specific hosts."

  ssh_key_compromised:
    label: "Compromised SSH key"
    checks:
      - name: "SSH key world-readable"
        how: "The SSH private key permissions allow other users to read it."
        evidence: ["git_credential_analysis.ssh_keys"]
        confirm: "ls -la ~/.ssh/id_* | grep -v '600'"
        skills: ["git_credential_analysis"]
        remediation: "Use chmod 600 for the private key and 644 for the public key."
      - name: "Unknown keys in authorized_keys"
        how: "Unrecognized SSH keys were added to authorized_keys."
        evidence: ["security_analysis.persistence_indicators", "ssh_hardening_analysis.authorized_keys"]
        confirm: "Compare current authorized_keys with the known baseline."
        skills: ["security_analysis", "ssh_hardening_analysis"]
        remediation: "Remove unrecognized keys and revoke them in the corresponding service."

  docker_secret_leak:
    label: "Secrets exposed through Docker"
    checks:
      - name: ".env mounted as a container volume"
        how: "The .env file is mounted as a Docker volume, exposing secrets to the container."
        evidence: ["docker_secrets_analysis.secret_mounts"]
        confirm: "docker inspect <container> --format '{{range .Mounts}}{{.Source}}' | grep .env"
        skills: ["docker_secrets_analysis"]
        remediation: "Use Docker secrets (Swarm) or named secrets instead of mounting .env."
      - name: "Docker socket mounted inside a container"
        how: "The mounted docker.sock allows the container to control Docker."
        evidence: ["docker_secrets_analysis.privileged_containers"]
        confirm: "docker inspect <container> --format '{{range .Mounts}}{{.Source}}' | grep docker.sock"
        skills: ["docker_secrets_analysis"]
        remediation: "Do not mount docker.sock in application containers."
      - name: "Privileged container"
        how: "A container has full privileges over the host."
        evidence: ["docker_secrets_analysis.privileged_containers"]
        confirm: "docker inspect <container> --format '{{.HostConfig.Privileged}}'"
        skills: ["docker_secrets_analysis"]
        remediation: "Remove --privileged and use specific capabilities."

  web_secret_exposure:
    label: "Secrets exposed through the web server"
    checks:
      - name: "Web server serves .env directly"
        how: "An HTTP request to /.env returns 200 with the file contents."
        evidence: ["web_secret_exposure.web_env_access"]
        confirm: "curl -I http://localhost/.env"
        skills: ["web_secret_exposure"]
        remediation: "Block .env in nginx/apache configuration and remove .env from DocumentRoot."
      - name: "Exposed phpinfo()"
        how: "Accessible phpinfo.php exposes server environment variables."
        evidence: ["web_secret_exposure.phpinfo_exposed"]
        confirm: "curl -I http://localhost/phpinfo.php"
        skills: ["web_secret_exposure"]
        remediation: "Remove phpinfo.php from production."

  exfiltration_detected:
    label: "Detected data exfiltration"
    checks:
      - name: "Cron curl/wget to an unknown endpoint"
        how: "A cron job runs curl/wget against an endpoint outside the system."
        evidence: ["network_exfiltration.cron_network_usage"]
        confirm: "Inspect /etc/cron.d/* and /var/spool/cron/* for curl commands."
        skills: ["network_exfiltration"]
        remediation: "Remove the cron job, investigate its origin and rotate credentials."
      - name: "Active SSH tunnel"
        how: "An active ssh process uses -R/-L/-D flags (reverse tunnel/proxy)."
        evidence: ["network_exfiltration.ssh_tunnels"]
        confirm: "ps aux | grep 'ssh.*-[RLD]'"
        skills: ["network_exfiltration"]
        remediation: "Close the tunnel and investigate who opened it."
      - name: "Outbound connections to non-standard ports"
        how: "Outbound connections use ports such as 4444, 1337 or 31337 (common in C2)."
        evidence: ["network_exfiltration.outbound_connections"]
        confirm: "ss -tnp | grep -E ':4444|:1337|:31337'"
        skills: ["network_exfiltration"]
        remediation: "Block the traffic and investigate the originating process."
